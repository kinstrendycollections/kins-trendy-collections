<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kins Product Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600&family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --ivory:#FAF6EF; --green:#24473F; --copper:#C1702D; --sand:#E8DCC5; --sage:#7C8C6B; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ivory); color:#1f2a27; font-family:Karla,system-ui,sans-serif; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:20px 16px 80px; }
  h1,h2 { font-family:Newsreader,Georgia,serif; color:var(--green); margin:0 0 8px; }
  h1 { font-size:1.9rem; } h2 { font-size:1.3rem; }
  p.sub { margin:0 0 20px; color:#4b5a55; }
  .card { background:#fff; border:1px solid var(--sand); border-radius:14px; padding:18px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:14px 0 4px; }
  label small { font-weight:400; color:#5d6b66; }
  input, select, textarea { width:100%; padding:11px 12px; border:1px solid #cdbf9f; border-radius:10px; font:inherit; background:#fff; }
  textarea { min-height:120px; resize:vertical; }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:13px 18px; cursor:pointer; background:var(--green); color:#fff; width:100%; margin-top:16px; }
  button.copper { background:var(--copper); }
  button.ghost { background:transparent; color:var(--green); border:1px solid var(--green); }
  button:disabled { opacity:.55; cursor:wait; }
  .thumbs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .thumbs div { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--sand); }
  .thumbs img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumbs button { position:absolute; top:4px; right:4px; width:26px; height:26px; padding:0; margin:0; border-radius:50%; background:rgba(0,0,0,.65); font-size:14px; line-height:26px; }
  .msg { padding:12px 14px; border-radius:10px; margin-top:14px; display:none; }
  .msg.err { display:block; background:#fdeaea; color:#8a1f1f; }
  .msg.ok { display:block; background:#e7f1e4; color:#24473F; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chips span { background:var(--sand); border-radius:999px; padding:3px 10px; font-size:.85rem; }
  .hint { font-size:.9rem; color:#5d6b66; margin-top:6px; }
  .check { display:flex; align-items:flex-start; gap:10px; font-weight:600; margin:14px 0 0; }
  .check input { width:auto; margin-top:4px; }
  .thumbs button.tog { top:auto; right:auto; left:4px; bottom:4px; width:auto; height:22px; padding:0 8px; border-radius:11px; font-size:.7rem; line-height:22px; }
  .thumbs .badge { position:absolute; left:4px; bottom:4px; background:rgba(0,0,0,.65); color:#fff; font-size:.7rem; padding:2px 8px; border-radius:11px; }
  .hidden { display:none; }
  a { color:var(--copper); }
</style>
</head>
<body>
<main>
  <h1>Kins Product Studio</h1>
  <p class="sub">Photos in, product page out.</p>

  <!-- Step 0: password -->
  <section id="login" class="card">
    <h2>Sign in</h2>
    <label for="pw">Studio password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="loginBtn">Continue</button>
    <div id="loginMsg" class="msg"></div>
  </section>

  <div id="app" class="hidden">
    <!-- Step 1: photos + basics -->
    <section class="card">
      <h2>1. Add the product</h2>
      <label for="files">Photos <small>(1 to 4, clear and well lit)</small></label>
      <input id="files" type="file" accept="image/*" multiple>
      <label class="check" for="autoClean">
        <input id="autoClean" type="checkbox">
        <span>Clean new photos automatically <small>(white background; it can be slow, so by default you choose when)</small></span>
      </label>
      <div id="thumbs" class="thumbs"></div>
      <div id="bgButtons" class="hidden">
        <button id="cleanAllBtn" type="button" class="ghost">Remove backgrounds</button>
        <button id="stopCleanBtn" type="button" class="ghost hidden">Stop cleaning</button>
      </div>
      <p id="bgStatus" class="hint"></p>

      <label for="category">Category</label>
      <select id="category">
        <option value="utensils">Utensils</option>
        <option value="ladies-shoes">Ladies' Shoes</option>
        <option value="mens-shoes">Men's Shoes</option>
        <option value="school-shoes">School Shoes</option>
        <option value="gumboots">Gumboots &amp; Safety Boots</option>
        <option value="clothes">Clothes</option>
        <option value="electricals">Electricals</option>
        <option value="hardware">Hardware</option>
      </select>

      <div class="row">
        <div>
          <label for="cost">Your cost <small>(KES)</small></label>
          <input id="cost" type="number" inputmode="decimal" min="0" placeholder="e.g. 1800">
        </div>
        <div>
          <label for="margin">Profit margin <small>(%)</small></label>
          <input id="margin" type="number" inputmode="decimal" min="0" value="40">
        </div>
      </div>

      <label for="notes">Anything the AI should know <small>(optional: sizes, material, brand)</small></label>
      <textarea id="notes" style="min-height:70px" placeholder="e.g. Sizes 38 to 44, genuine leather"></textarea>

      <button id="genBtn" class="copper">Generate listing</button>
      <button id="manualBtn" type="button" class="ghost">Skip the AI, I'll write it myself</button>
      <div id="genMsg" class="msg"></div>
    </section>

    <!-- Step 2: review and publish -->
    <section id="review" class="card hidden">
      <h2>2. Check and publish</h2>
      <p class="hint">Edit anything you like. The price is a suggestion: cost plus your margin, rounded to the nearest KES 50.</p>

      <label for="name">Product name</label>
      <input id="name" maxlength="100">

      <div class="row">
        <div>
          <label for="price">Selling price <small>(KES)</small></label>
          <input id="price" type="number" inputmode="decimal" min="1">
        </div>
        <div>
          <label for="compare">Original price <small>(optional)</small></label>
          <input id="compare" type="number" inputmode="decimal" min="0">
        </div>
      </div>

      <label for="short">Short description</label>
      <input id="short" maxlength="200">

      <label for="desc">Full description</label>
      <textarea id="desc"></textarea>

      <label for="sku">SKU <small>(leave empty to auto-create)</small></label>
      <input id="sku">

      <label>Search keywords <small>(for your reference)</small></label>
      <div id="keywords" class="chips"></div>

      <button id="pubBtn">Publish to the store</button>
      <button id="backBtn" class="ghost">Start over</button>
      <div id="pubMsg" class="msg"></div>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let password = sessionStorage.getItem('studioPw') || '';
// Each photo: { orig, clean, useClean, status }  (status: idle, queued, working, done, failed)
// orig and clean are resized JPEG data URLs.
let photos = [];
const imageFor = (p) => (p.useClean && p.clean ? p.clean : p.orig);
const stillCleaning = () => photos.some((p) => p.status === 'queued' || p.status === 'working');

function show(el, text, kind) {
  el.className = 'msg ' + kind;
  el.textContent = text;
}
function clear(el) { el.className = 'msg'; el.textContent = ''; }

async function api(path, payload) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-admin-key': password },
    body: JSON.stringify(payload || {}),
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || 'Something went wrong (' + res.status + ').');
  return data;
}

// ----- login -----
async function tryLogin() {
  try {
    await api('/api/ping');
    sessionStorage.setItem('studioPw', password);
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    return true;
  } catch (e) {
    sessionStorage.removeItem('studioPw');
    return e;
  }
}
$('loginBtn').onclick = async () => {
  password = $('pw').value;
  const r = await tryLogin();
  if (r !== true) show($('loginMsg'), r.message, 'err');
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
if (password) tryLogin();

// ----- photos -----
async function resizeToDataUrl(file, maxSide = 1280) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bmp.width * scale);
  canvas.height = Math.round(bmp.height * scale);
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.82);
}

// ----- background removal (runs on the phone, no cost) -----
// The cleaning tool is downloaded once from a public CDN and cached by the browser.
const BG_LIB_URLS = [
  'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm',
  'https://esm.sh/@imgly/background-removal@1.7.0',
];
let bgRemover = null;

function setBgStatus(text) { $('bgStatus').textContent = text; }

async function loadRemover() {
  if (bgRemover) return bgRemover;
  const errors = [];
  for (const url of BG_LIB_URLS) {
    try {
      const mod = await import(url);
      const d = mod.default;
      const fn = mod.removeBackground || (d && d.removeBackground) || d;
      if (typeof fn === 'function') { bgRemover = fn; return fn; }
      errors.push('no cleaning function found');
    } catch (e) {
      errors.push(String((e && e.message) || e));
    }
  }
  const err = new Error('could not load the cleaning tool (' + errors.join(' | ').slice(0, 220) + ')');
  err.isLoadError = true;
  throw err;
}

let lastBgProgress = 0;
function onBgProgress(key, current, total) {
  if (total > 0 && String(key).startsWith('fetch')) {
    lastBgProgress = Date.now();
    setBgStatus('Downloading the cleaning tool, first time only (' + Math.round((100 * current) / total) + '%). Keep this page open.');
  }
}

async function cutOut(dataUrl) {
  const remove = await loadRemover();
  const input = await (await fetch(dataUrl)).blob();
  const run = (model) => remove(input, { model, output: { format: 'image/png' }, progress: onBgProgress });
  try { return await run('isnet_quint8'); }   // smaller download, good for phones
  catch (e) { return await run('isnet_fp16'); }
}

// Put the cut-out product, centred and filling the frame, on a white square.
async function composeOnWhite(blob, size = 1200) {
  const bmp = await createImageBitmap(blob);

  // Find where the product is, using a small copy for speed.
  const scale = Math.min(1, 400 / Math.max(bmp.width, bmp.height));
  const probe = document.createElement('canvas');
  probe.width = Math.max(1, Math.round(bmp.width * scale));
  probe.height = Math.max(1, Math.round(bmp.height * scale));
  const pctx = probe.getContext('2d', { willReadFrequently: true });
  pctx.drawImage(bmp, 0, 0, probe.width, probe.height);
  const { data, width, height } = pctx.getImageData(0, 0, probe.width, probe.height);
  let minX = width, minY = height, maxX = -1, maxY = -1, solid = 0;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      if (data[(y * width + x) * 4 + 3] > 24) {
        solid++;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0 || solid / (width * height) < 0.02) throw new Error('no product found in the photo');

  const bx = minX / scale, by = minY / scale;
  const bw = (maxX - minX + 1) / scale, bh = (maxY - minY + 1) / scale;
  const pad = Math.max(bw, bh) * 0.06;
  const x0 = Math.max(0, bx - pad), y0 = Math.max(0, by - pad);
  const x1 = Math.min(bmp.width, bx + bw + pad), y1 = Math.min(bmp.height, by + bh + pad);
  const sw = x1 - x0, sh = y1 - y0;

  const out = document.createElement('canvas');
  out.width = out.height = size;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  ctx.imageSmoothingQuality = 'high';
  const k = Math.min(size / sw, size / sh, 2); // never blow a small cut-out up more than 2x
  const dw = sw * k, dh = sh * k;
  ctx.drawImage(bmp, x0, y0, sw, sh, (size - dw) / 2, (size - dh) / 2, dw, dh);
  return out.toDataURL('image/jpeg', 0.88);
}

let cleaning = false;
let cleanEpoch = 0; // bumped by "Stop cleaning" so an old run quietly gives up
async function runCleanQueue() {
  if (cleaning) return;
  cleaning = true;
  const epoch = cleanEpoch;
  let failures = 0, successes = 0, lastError = '';
  try {
    for (;;) {
      if (epoch !== cleanEpoch) return;
      const p = photos.find((x) => x.status === 'queued');
      if (!p) break;
      p.status = 'working';
      renderThumbs();
      const started = Date.now();
      setBgStatus('Cleaning photo... 0 seconds. The first time is the slowest.');
      const tick = setInterval(() => {
        if (Date.now() - lastBgProgress > 2000) {
          setBgStatus('Cleaning photo... ' + Math.round((Date.now() - started) / 1000) + ' seconds. Keep this page open.');
        }
      }, 1000);
      try {
        const clean = await composeOnWhite(await cutOut(p.orig));
        if (epoch !== cleanEpoch) return;
        p.clean = clean;
        p.useClean = true;
        p.status = 'done';
        successes++;
      } catch (err) {
        if (epoch !== cleanEpoch) return;
        console.error('Background removal failed:', err);
        p.status = 'failed';
        p.useClean = false;
        failures++;
        lastError = (err && err.message) || String(err);
        if (err && err.isLoadError) {
          photos.filter((x) => x.status === 'queued').forEach((x) => { x.status = 'failed'; failures++; });
        }
      } finally {
        clearInterval(tick);
      }
      renderThumbs();
    }
  } finally {
    if (epoch === cleanEpoch) cleaning = false;
  }
  if (failures) {
    setBgStatus('Could not clean ' + failures + ' photo' + (failures > 1 ? 's' : '') + ': ' + lastError + '. The original photo will be used. Tap Retry to try again.');
  } else if (successes) {
    setBgStatus('Done. Tap the small button on a photo to switch between the cleaned and original versions. Cut-outs work best when the product is on its own.');
  }
}

function renderThumbs() {
  $('thumbs').innerHTML = '';
  photos.forEach((p, i) => {
    const d = document.createElement('div');
    const img = document.createElement('img');
    img.src = imageFor(p);
    const x = document.createElement('button');
    x.textContent = '×';
    x.setAttribute('aria-label', 'Remove photo');
    x.onclick = () => { photos.splice(i, 1); renderThumbs(); };
    d.append(img, x);

    if (p.status === 'working' || p.status === 'queued') {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = p.status === 'working' ? 'Cleaning...' : 'Waiting...';
      d.append(badge);
    } else {
      const t = document.createElement('button');
      t.className = 'tog';
      if (p.clean) {
        t.textContent = p.useClean ? 'Original' : 'Cleaned';
        t.setAttribute('aria-label', p.useClean ? 'Use the original photo' : 'Use the cleaned photo');
        t.onclick = () => { p.useClean = !p.useClean; renderThumbs(); };
      } else {
        t.textContent = p.status === 'failed' ? 'Retry' : 'Clean';
        t.setAttribute('aria-label', 'Remove the background of this photo');
        t.onclick = () => { p.status = 'queued'; renderThumbs(); runCleanQueue(); };
      }
      d.append(t);
    }
    $('thumbs').append(d);
  });

  // Buttons under the photos: clean them all, or stop.
  const busy = stillCleaning();
  const todo = photos.some((p) => !p.clean && p.status !== 'queued' && p.status !== 'working');
  $('bgButtons').classList.toggle('hidden', !photos.length || (!busy && !todo));
  $('stopCleanBtn').classList.toggle('hidden', !busy);
  $('cleanAllBtn').classList.toggle('hidden', busy || !todo);
}

$('cleanAllBtn').onclick = () => {
  photos.forEach((p) => {
    if (!p.clean && p.status !== 'queued' && p.status !== 'working') p.status = 'queued';
  });
  renderThumbs();
  runCleanQueue();
};

$('stopCleanBtn').onclick = () => {
  cleanEpoch++;
  cleaning = false;
  photos.forEach((p) => {
    if (p.status === 'queued' || p.status === 'working') p.status = 'idle';
  });
  setBgStatus('Stopped. Your original photos will be used. Tap Remove backgrounds to try again.');
  renderThumbs();
};

$('files').onchange = async (e) => {
  clear($('genMsg'));
  const files = Array.from(e.target.files).slice(0, 4 - photos.length);
  for (const f of files) {
    try {
      const orig = await resizeToDataUrl(f);
      photos.push({ orig, clean: null, useClean: false, status: $('autoClean').checked ? 'queued' : 'idle' });
    } catch (err) {
      show($('genMsg'), 'Could not read one of the photos.', 'err');
    }
  }
  e.target.value = '';
  renderThumbs();
  if (photos.some((p) => p.status === 'queued')) runCleanQueue();
};

// ----- generate -----
function suggestPrice(cost, marginPct) {
  const raw = cost * (1 + marginPct / 100);
  return Math.max(50, Math.round(raw / 50) * 50);
}

// Shared checks before Generate or "write it myself".
function checkInputs() {
  clear($('genMsg'));
  const cost = Number($('cost').value);
  const margin = Number($('margin').value);
  const fail = (text) => { show($('genMsg'), text, 'err'); return null; };
  if (!photos.length) return fail('Add at least one photo first.');
  if (stillCleaning()) return fail('Your photos are still being cleaned. Wait for them to finish, or tap "Stop cleaning" to use the original photos.');
  if (!(cost > 0)) return fail('Enter what the product costs you.');
  if (!(margin >= 0)) return fail('Enter a profit margin (0 or more).');
  return { cost, margin };
}

// For when the AI is unavailable (for example its daily quota is used up).
$('manualBtn').onclick = () => {
  const v = checkInputs();
  if (!v) return;
  if ($('review').classList.contains('hidden')) {
    ['name', 'short', 'desc', 'sku', 'compare'].forEach((id) => { $(id).value = ''; });
    $('keywords').innerHTML = '';
  }
  $('price').value = suggestPrice(v.cost, v.margin);
  clear($('pubMsg'));
  $('review').classList.remove('hidden');
  $('review').scrollIntoView({ behavior: 'smooth' });
  $('name').focus();
};

$('genBtn').onclick = async () => {
  const v = checkInputs();
  if (!v) return;
  const { cost, margin } = v;

  $('genBtn').disabled = true;
  $('genBtn').textContent = 'Reading your photos...';
  try {
    const { listing } = await api('/api/generate', {
      images: photos.map(imageFor),
      category: $('category').value,
      notes: $('notes').value,
    });
    $('name').value = listing.name;
    $('short').value = listing.shortDescription;
    $('desc').value = listing.description;
    $('category').value = listing.category;
    $('price').value = suggestPrice(cost, margin);
    $('compare').value = '';
    $('sku').value = '';
    $('keywords').innerHTML = '';
    listing.keywords.forEach((k) => {
      const s = document.createElement('span');
      s.textContent = k;
      $('keywords').append(s);
    });
    clear($('pubMsg'));
    $('review').classList.remove('hidden');
    $('review').scrollIntoView({ behavior: 'smooth' });
  } catch (err) {
    show($('genMsg'), err.message, 'err');
  } finally {
    $('genBtn').disabled = false;
    $('genBtn').textContent = 'Generate listing';
  }
};

// ----- publish -----
$('pubBtn').onclick = async () => {
  clear($('pubMsg'));
  if (stillCleaning()) return show($('pubMsg'), 'Your photos are still being cleaned. Please wait until they finish.', 'err');
  $('pubBtn').disabled = true;
  $('pubBtn').textContent = 'Publishing...';
  try {
    const out = await api('/api/publish', {
      images: photos.map(imageFor),
      name: $('name').value,
      category: $('category').value,
      price: $('price').value,
      compareAtPrice: $('compare').value,
      shortDescription: $('short').value,
      description: $('desc').value,
      sku: $('sku').value,
    });
    const msg = $('pubMsg');
    msg.className = 'msg ok';
    msg.textContent = out.rebuild === 'started'
      ? 'Published! Your site is rebuilding and the product should appear in 1 to 2 minutes: '
      : 'Saved, but the site rebuild did not start by itself. Edit README.md on GitHub to force one, then the product appears at: ';
    const a = document.createElement('a');
    a.href = out.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = out.url;
    msg.append(a);
  } catch (err) {
    show($('pubMsg'), err.message, 'err');
  } finally {
    $('pubBtn').disabled = false;
    $('pubBtn').textContent = 'Publish to the store';
  }
};

$('backBtn').onclick = () => {
  photos = []; renderThumbs(); setBgStatus('');
  ['cost','notes','name','short','desc','price','compare','sku'].forEach((id) => { $(id).value = ''; });
  $('review').classList.add('hidden');
  clear($('pubMsg')); clear($('genMsg'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
</script>
</body>
</html>
